server {
    listen 80;
    server_name _;

    # Allow large Excel / PDF batch uploads
    client_max_body_size 100M;

    # Data Management Engine (/api/data/* -> data-engine:8001/*)
    location /api/data/ {
        proxy_pass http://data-engine:8001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_request_buffering off;
    }

    # RAG & Dynamic AI Engine (/api/rag/* -> rag-engine:8002/*)
    # SSE streaming requires buffering off and Connection ''
    location /api/rag/ {
        proxy_pass http://rag-engine:8002/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 300s;
    }

    # Frontend SPA
    location / {
        proxy_pass http://ui:80/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
