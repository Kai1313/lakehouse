services:
  minio:
    image: pgsty/silo:latest
    container_name: lakehouse-minio
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  minio-init:
    image: pgsty/silo:latest
    container_name: lakehouse-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-lakehouse}
      MINIO_BUCKET_QUOTA: ${MINIO_BUCKET_QUOTA:-2GB}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ACCESS_KEY} $${MINIO_SECRET_KEY} &&
      mc mb --ignore-existing local/$${MINIO_BUCKET} &&
      mc quota set local/$${MINIO_BUCKET} --size $${MINIO_BUCKET_QUOTA} &&
      echo 'MinIO bucket initialized:' $${MINIO_BUCKET} '(quota:' $${MINIO_BUCKET_QUOTA}')'
      "
    restart: "no"

  postgres:
    image: pgvector/pgvector:pg16
    container_name: lakehouse-postgres
    ports:
      - "${POSTGRES_PORT:-5435}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lakehouse_db}
      POSTGRES_USER: ${POSTGRES_USER:-lakehouse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lakehouse_secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lakehouse} -d ${POSTGRES_DB:-lakehouse_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  data-engine:
    build:
      context: ./data-engine
    container_name: lakehouse-data-engine
    profiles: ["full"]
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    ports:
      - "${DATA_ENGINE_PORT:-8001}:8001"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-lakehouse}:${POSTGRES_PASSWORD:-lakehouse_secret}@postgres:5432/${POSTGRES_DB:-lakehouse_db}
      MINIO_ENDPOINT: http://minio:9000
    healthcheck:
      test: ["CMD", ".venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  rag-engine:
    build:
      context: ./rag-engine
    container_name: lakehouse-rag-engine
    profiles: ["full"]
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    ports:
      - "${RAG_ENGINE_PORT:-8002}:8002"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-lakehouse}:${POSTGRES_PASSWORD:-lakehouse_secret}@postgres:5432/${POSTGRES_DB:-lakehouse_db}
      MINIO_ENDPOINT: http://minio:9000
      OLLAMA_API_BASE: http://host.docker.internal:11434
    healthcheck:
      test: ["CMD", ".venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  ui:
    build:
      context: ./ui
    container_name: lakehouse-ui
    profiles: ["full"]
    depends_on:
      data-engine:
        condition: service_healthy
      rag-engine:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:80/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  nginx:
    image: nginx:1.27-alpine
    container_name: lakehouse-nginx
    profiles: ["full"]
    depends_on:
      ui:
        condition: service_healthy
      data-engine:
        condition: service_healthy
      rag-engine:
        condition: service_healthy
    ports:
      - "${APP_PORT:-3100}:80"
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:80/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  minio_data:
  postgres_data:
