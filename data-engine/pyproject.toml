[project]
name = "data-engine"
version = "0.1.0"
description = "Data Management & Lakehouse Ingestion Service (Bronze/Silver/Gold + Delta Lake)"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.1",
    "psycopg[binary]>=3.2.3",
    "boto3>=1.35.0",
    "deltalake>=0.21.0",
    "pyarrow>=17.0.0",
    "pandas>=2.2.3",
    "openpyxl>=3.1.5",
    "xlrd>=2.0.1",
    "duckdb>=1.1.3",
    "pymupdf>=1.24.10",
    "pdfplumber>=0.11.4",
    "litellm>=1.52.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "httpx>=0.27.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
